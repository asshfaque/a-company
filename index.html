<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Alphytix — Automate. Engage. Grow.">

    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>Alphytix — Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #1261ff;
            --orange: #ff7300;
            --dark: #07111f;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .intro {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at center,
                    rgba(18, 97, 255, 0.08),
                    transparent 40%
                ),
                #ffffff;
        }

        /* Background circles */

        .circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(18, 97, 255, 0.12);
            animation: rotate 10s linear infinite;
        }

        .circle.one {
            width: 500px;
            height: 500px;
        }

        .circle.two {
            width: 350px;
            height: 350px;
            border-color: rgba(255, 115, 0, 0.16);
            animation-duration: 7s;
            animation-direction: reverse;
        }

        .circle.three {
            width: 200px;
            height: 200px;
            border-style: dashed;
            animation-duration: 5s;
        }

        /* Main content */

        .content {
            position: relative;
            z-index: 5;
            text-align: center;
        }

        .logo {
            font-size: clamp(4rem, 10vw, 8rem);
            font-weight: 900;
            letter-spacing: -7px;
            color: #07111f;

            opacity: 0;
            transform: translateY(25px);

            animation:
                logoIn 1s ease forwards,
                logoFloat 3s ease-in-out 1.2s infinite;
        }

        .logo span {
            color: var(--orange);
        }

        .tagline {
            margin-top: 18px;

            font-size: clamp(1rem, 2vw, 1.35rem);
            font-weight: 600;
            letter-spacing: 5px;
            text-transform: uppercase;

            color: #667085;

            opacity: 0;
            animation: taglineIn 1s ease 0.7s forwards;
        }

        .tagline .blue {
            color: var(--blue);
        }

        .tagline .orange {
            color: var(--orange);
        }

        /* Loading line */

        .loader {
            width: 180px;
            height: 3px;
            margin: 45px auto 0;

            background: #e7ecf5;
            border-radius: 20px;
            overflow: hidden;

            opacity: 0;
            animation: fadeIn 0.8s ease 1.2s forwards;
        }

        .loader::after {
            content: "";
            display: block;

            width: 0;
            height: 100%;

            background: linear-gradient(
                90deg,
                var(--blue),
                var(--orange)
            );

            animation: loading 2.4s ease 1.3s forwards;
        }

        .loading-text {
            margin-top: 14px;

            color: #98a2b3;
            font-size: 0.75rem;
            letter-spacing: 2px;

            opacity: 0;
            animation: fadeIn 0.8s ease 1.3s forwards;
        }

        /* Animated nodes */

        .node {
            position: absolute;

            width: 10px;
            height: 10px;

            border-radius: 50%;

            background: var(--blue);

            box-shadow:
                0 0 20px rgba(18, 97, 255, 0.45);

            animation: nodeFloat 3s ease-in-out infinite;
        }

        .node.orange {
            background: var(--orange);

            box-shadow:
                0 0 20px rgba(255, 115, 0, 0.45);
        }

        .node.n1 {
            top: 25%;
            left: 25%;
        }

        .node.n2 {
            top: 30%;
            right: 22%;
            animation-delay: .5s;
        }

        .node.n3 {
            bottom: 25%;
            left: 20%;
            animation-delay: 1s;
        }

        .node.n4 {
            bottom: 20%;
            right: 25%;
            animation-delay: 1.5s;
        }

        /* Transition */

        .intro.exit {
            animation: exitScreen 0.8s ease forwards;
        }

        /* Animations */

        @keyframes logoIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        @keyframes taglineIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes loading {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes nodeFloat {
            0%, 100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-15px) scale(1.2);
            }
        }

        @keyframes exitScreen {
            to {
                opacity: 0;
                transform: scale(1.08);
            }
        }

        /* Accessibility */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }

        @media (max-width: 600px) {
            .circle.one {
                width: 350px;
                height: 350px;
            }

            .circle.two {
                width: 250px;
                height: 250px;
            }

            .circle.three {
                width: 150px;
                height: 150px;
            }

            .tagline {
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

    <main class="intro" id="intro">

        <!-- Animated background -->
        <div class="circle one"></div>
        <div class="circle two"></div>
        <div class="circle three"></div>

        <!-- Floating AI nodes -->
        <div class="node n1"></div>
        <div class="node orange n2"></div>
        <div class="node n3"></div>
        <div class="node orange n4"></div>

        <!-- Main intro -->
        <div class="content">

            <div class="logo">
                Alphytix<span>.</span>
            </div>

            <div class="tagline">
                <span class="blue">Automate.</span>
                <span class="orange">Engage.</span>
                <span class="blue">Grow.</span>
            </div>

            <div class="loader"></div>

            <div class="loading-text">
                POWERING DIGITAL GROWTH
            </div>

        </div>

    </main>


    <script>
        "use strict";

        /*
         * The intro remains visible for approximately 3.8 seconds.
         * Then the user is taken to the main website.
         */

        window.addEventListener("load", function () {

            const intro = document.getElementById("intro");

            setTimeout(function () {

                intro.classList.add("exit");

                setTimeout(function () {
                    window.location.replace("intro.html");
                }, 700);

            }, 3800);

        });
    </script>

</body>
</html>
